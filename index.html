<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luno Host Shell</title>
  <style>html, body { background: #0d1117 !important; color: #c9d1d9; font-family: monospace; margin: 0; padding: 0; min-height: 100vh; }</style>
  <script src="/app/acorn.js"></script>
  <script src="/app/LunoLoader.js"></script>
</head>
<body>
  <div id="app-root"></div>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      if (typeof LunoLoader !== 'undefined' && typeof LunoLoader.loadApp === 'function') {
        LunoLoader.loadApp('app-root');
      }
    });
  </script>
</body>
</html>

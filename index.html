<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Luno Workspace</title>
  <style>
    html, body {
      background: #0d1117 !important;
      color: #c9d1d9;
      font-family: monospace;
      margin: 0;
      padding: 0;
      min-height: 100vh;
    }
    #app-root {
      min-height: 100vh;
      width: 100%;
    }
    #boot-status {
      padding: 1.5rem;
      background: #161b22;
      border: 2px solid #00f2fe;
      border-radius: 10px;
      margin: 1.5rem auto;
      max-width: 600px;
      color: #c9d1d9;
      box-shadow: 0 4px 16px rgba(0, 242, 254, 0.25);
    }
  </style>
  <script src="/app/acorn.js"></script>
  <script src="/app/LunoLoader.js"></script>
</head>
<body>
  <div id="app-root">
    <div id="boot-status">
      <h3 style="color:#00f2fe; margin-top:0;">🌙 Initializing Luno Workspace...</h3>
      <p style="font-size:12px; color:#8b949e;">Loading scripts from luno.json...</p>
    </div>
  </div>
  <script>
    window.addEventListener('error', function(e) {
      var root = document.getElementById('app-root');
      if (root) {
        root.innerHTML = '<div style="padding:1.5rem;background:#2c080a;color:#ff7b72;border:2px solid #f85149;border-radius:8px;font-family:monospace;margin:1rem;">' +
          '<h3>❌ Browser Boot Exception</h3>' +
          '<p><strong>Error:</strong> ' + e.message + '</p>' +
          '<p><strong>File:</strong> ' + (e.filename || 'unknown') + ' (Line ' + e.lineno + ')</p>' +
          '</div>';
      }
    });
    document.addEventListener("DOMContentLoaded", async function() {
      if (typeof LunoLoader !== "undefined") {
        await LunoLoader.loadApp("app-root");
      }
    });
  </script>
</body>
</html>

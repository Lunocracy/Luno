<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bookmarklet Workshop - Luno</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      padding: 1rem;
      min-height: 100vh;
      font-family: monospace;
      background: #0d1117;
      color: #c9d1d9;
    }
    #workshop-root {
      max-width: 780px;
      margin: 0 auto;
    }
  </style>
</head>
<body>
  <div id="workshop-root"></div>

  <script src="LunoRelayProtocol.js"><\/script>
  <script src="JsLanguageDetector.js"><\/script>
  <script src="CodeCollapserWidget.js"><\/script>
  <script src="PromptCollapserWidget.js"><\/script>
  <script src="ResponseGroupWidget.js"><\/script>
  <script src="AiStudioQueue.js"><\/script>
  <script src="OutboxNotifier.js"><\/script>
  <script src="BookmarkletPresets.js"><\/script>
  <script src="BookmarkletEncoder.js"><\/script>
  <script src="BookmarkletUI.js"><\/script>
  <script src="BookmarkletApp.js"><\/script>
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const root = document.getElementById('workshop-root');
      const app = new BookmarkletApp();
      app.init(root);
    });
  <\/script>
</body>
</html>
